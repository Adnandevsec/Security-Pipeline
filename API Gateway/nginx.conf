events { worker_connections 1024; }

http {
    # 1. Rate Limiting Zones (حدّ الطلبات لكل IP لمنع الـ Brute Force وحماية الـ APIs)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

    # 2. Quotas / Connection Limits (تحديد عدد الاتصالات المتزامنة لكل IP لمنع الاستنزاف)
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    upstream auth_upstream {
        server auth-service:8000;
    }
    upstream signup_upstream {
        server signup-service:8000;
    }
    upstream product_upstream {
        server product-service:8000;
    }
    upstream profile_upstream {
        server profile-service:8000;
    }
    upstream notification_upstream {
        server notification-service:8000;
    }

    server {
        listen 80;

        # تطبيق حدود الاتصالات العامة (Quotas/Connection limits)
        limit_conn addr_conn 20;

        # منع هجمات الـ SSRF وحظر الطلبات التي تستهدف عناوين داخلية أو خارجية غير مصرح بها عبر الـ Gateway
        if ($query_string ~* "(http|https|ftp|file)://") {
            return 403;
        }

        # Input Validation أساسي: حظر الطلبات التي تحتوي على أكواد خبيثة مشبوهة في الـ URI (مثل SQLi أو XSS patterns بسيطة)
        if ($request_uri ~* "(\;|'|\"|<|>|\(|\))") {
            return 400;
        }

        location /auth/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /auth;
            proxy_hide_header X-Powered-By;
        }

        location /signup/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://signup_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /signup;
            proxy_hide_header X-Powered-By;
        }

        location /products/ {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://product_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /products;
            proxy_hide_header X-Powered-By;
        }

        location /profile/ {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://profile_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /profile;
            proxy_hide_header X-Powered-By;
        }

       location /notifications/ {
            proxy_pass http://notification_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /notifications;
            proxy_hide_header X-Powered-By;
        }
    }
}
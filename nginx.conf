user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- 1. Rate Limiting Definitions ---
    # تحديد مساحة تخزين لتتبع الـ IPs ومنع هجمات التخمين Brute-force أو الـ DoS
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

    # إخفاء إصدار NGINX لأسباب أمنية (Security through obscurity)
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        # --- 2. Input Validation & Payload Size Limits ---
        # منع هجمات الـ Buffer Overflow بتحديد الحد الأقصى لحجم الطلب بـ 1 ميغابايت
        client_max_body_size 1M;

        # --- 3. Global Security Headers (OWASP Recommended) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # ==========================================
        # 4. Routing to the 5 Microservices
        # ==========================================

        # --- A. Signup Service ---
        location /api/v1/signup {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://signup-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- B. Auth / Login Service (Protected with strict Rate Limiting) ---
        location /api/v1/login {
            # حماية مشددة على تسجيل الدخول ضد التخمين (API03 / Brute-force protection)
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- C. Profile Service ---
        location /api/v1/profile {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- D. Product Service ---
        location /api/v1/products {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://product-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- E. Notification Service ---
        location /api/v1/notify {
            limit_req zone=general_limit burst=10 nodelay;
            proxy_pass http://notification-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Health Check for Gateway ---
        location /healthz {
            return 200 'gateway is healthy';
            add_header Content-Type text/plain;
        }
    }
}